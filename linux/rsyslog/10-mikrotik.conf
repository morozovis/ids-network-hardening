# /etc/rsyslog.d/10-mikrotik.conf
# Приём журналов MikroTik по UDP 514 в отдельный файл.
# Отдельный ruleset + stop: сообщения роутера не попадают в /var/log/syslog.
# В nftables порт 514 открыт только для адреса роутера:
#   ip saddr 10.0.0.1 udp dport 514 accept

module(load="imudp")
input(type="imudp" port="514" ruleset="mikrotik")

ruleset(name="mikrotik") {
  if $fromhost-ip == '10.0.0.1' then action(type="omfile" file="/var/log/mikrotik.log")
  stop
}
